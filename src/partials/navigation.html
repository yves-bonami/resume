<header class="top">
  <div class="top-inner">
    <a class="brand" href="#profiel">
      <img
        class="nav-photo"
        src="/yves-bonami.jpg"
        alt=""
        width="36"
        height="36"
      />
      Yves Bonami
    </a>
    <nav class="top-links" aria-label='{{"Hoofdnavigatie"}}'>
      <a href="#ervaring">{{"Ervaring"}}</a>
      <a href="#vaardigheden">{{"Vaardigheden"}}</a>
      <a href="mailto:yves.bonami@dev.run">{{"Contact"}}</a>
    </nav>
    <div class="nav-controls">
      <span class="language-switch" aria-label='{{"Taal"}}'>
        <a href="/" lang="nl" __NL_CURRENT__>NL</a>
        <a href="/en/" lang="en" __EN_CURRENT__>EN</a>
      </span>
      <button
        id="theme-toggle"
        class="theme-toggle"
        type="button"
        hidden
        aria-label='{{"Wissel kleurthema"}}'
        aria-pressed="false"
        data-light-label='{{"Lichte modus inschakelen"}}'
        data-dark-label='{{"Donkere modus inschakelen"}}'
      >
        <svg
          class="theme-moon"
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          aria-hidden="true"
        >
          <path d="M21 12.8A9 9 0 0 1 11.2 3a9 9 0 1 0 9.8 9.8Z" /></svg
        ><svg
          class="theme-sun"
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          aria-hidden="true"
        >
          <circle cx="12" cy="12" r="4" />
          <path
            d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"
          />
        </svg>
      </button>
    </div>
  </div>
</header>
